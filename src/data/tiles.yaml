# Hub wall content for borck.dev — one entry per tile.
# Schema per docs/hub-mosaic-plan.md; book tiers/parents mirror books-hq/docs/book-tiers.md.
#
# The wall shows three standard Books cards: two flagships + one collage card of four
# covers. Everything else is discovered at books.borck.education. The catalogue below
# stays complete so books.borck.education (or a future shelf expansion) can use it.

books_wall:
